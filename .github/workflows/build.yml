name: build arm64
on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "calcom/docker tag to build (its submodule pins the cal.com version)"
        required: true
        default: "v5.9.10"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout calcom/docker at the tag, with the cal.com submodule
        uses: actions/checkout@v4
        with:
          repository: calcom/docker
          ref: ${{ inputs.docker_tag }}
          submodules: recursive
          fetch-depth: 1
      - name: cal.com version from the submodule
        id: ver
        run: |
          v=$(python3 -c 'import json;print(json.load(open("calcom/apps/web/package.json"))["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "cal.com $v (docker tag ${{ inputs.docker_tag }})"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/jphein/calcom-arm64:v${{ steps.ver.outputs.version }}
            ghcr.io/jphein/calcom-arm64:latest
          build-args: |
            MAX_OLD_SPACE_SIZE=8192
            CALCOM_TELEMETRY_DISABLED=1
          labels: |
            org.opencontainers.image.source=https://github.com/calcom/cal.com
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
